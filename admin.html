<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLCS Hub | لوحة تحكم الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #07090e; color: #fff; padding: 30px; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .admin-header h1 { color: #00ffff; font-size: 24px; font-weight: 900; }
        
        .header-actions { display: flex; gap: 10px; }
        .back-site-btn, .export-btn { background: #1e293b; color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 700; transition: 0.3s; border: 1px solid #334155; cursor: pointer; display: inline-block; }
        .back-site-btn:hover, .export-btn:hover { background: #334155; border-color: #00ffff; color: #00ffff; }
        .export-btn { background: #065f46; border-color: #059669; }
        .export-btn:hover { background: #047857; color: #fff; }

        /* إحصائيات سريعة */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card h3 { color: #94a3b8; font-size: 14px; margin-bottom: 8px; }
        .stat-card p { color: #00ffff; font-size: 28px; font-weight: 900; }

        /* جدول المسجلين */
        .table-container { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; min-width: 800px; }
        th, td { padding: 15px 20px; border-bottom: 1px solid #1e293b; font-size: 14px; }
        th { background: #111e38; color: #00ffff; font-weight: 700; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block; cursor: pointer; border: none; }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-accepted { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-rejected { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

        .action-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .action-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>لوحة تحكم الإدارة - RLCS Hub</h1>
        <div class="header-actions">
            <button class="export-btn" onclick="exportToCSV()">📥 تصدير البيانات (Excel)</button>
            <a href="index.html" class="back-site-btn">العودة للموقع الرئيسي</a>
        </div>
    </div>

    <!-- بطاقات الإحصائيات -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>إجمالي المسجلين</h3>
            <p id="totalRegistrations">0</p>
        </div>
        <div class="stat-card">
            <h3>الفرق المقبولة</h3>
            <p id="totalAccepted">0</p>
        </div>
        <div class="stat-card">
            <h3>البطولات النشطة</h3>
            <p>3</p>
        </div>
    </div>

    <!-- جدول الطلبات -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اسم الفريق / اللاعب</th>
                    <th>الرانك</th>
                    <th>ديسكورد</th>
                    <th>طريقة الدفع</th>
                    <th>حالة الطلب (اضغط للتغيير)</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="registrationsTableBody">
                <tr>
                    <td colspan="7" style="text-align: center; color: #94a3b8;">جاري تحميل البيانات أو لا توجد تسجيلات حالياً...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function loadRegistrations() {
            let registrations = JSON.parse(localStorage.getItem('rlcsRegistrations')) || [];
            let tableBody = document.getElementById('registrationsTableBody');
            let totalRegs = document.getElementById('totalRegistrations');
            let totalAccepted = document.getElementById('totalAccepted');

            // تحديث الإحصائيات
            totalRegs.innerText = registrations.length;
            let acceptedCount = registrations.filter(r => r.status === 'مقبول ✅').length;
            totalAccepted.innerText = acceptedCount;

            if (registrations.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8;">لا توجد تسجيلات حتى الآن... جرب تسجل من الموقع الرئيسي!</td></tr>`;
                return;
            }

            tableBody.innerHTML = "";
            registrations.forEach((reg, index) => {
                // تحديد شكل وتنسيق الحالة
                let statusClass = 'status-pending';
                if (reg.status === 'مقبول ✅') statusClass = 'status-accepted';
                else if (reg.status === 'مرفوض ❌') statusClass = 'status-rejected';

                let row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td><b>${reg.name}</b></td>
                        <td>${reg.rank}</td>
                        <td>${reg.discord}</td>
                        <td>${reg.payment.toUpperCase()}</td>
                        <td>
                            <button class="status-badge ${statusClass}" onclick="toggleStatus(${reg.id})">
                                ${reg.status}
                            </button>
                        </td>
                        <td><button class="action-btn" onclick="deleteReg(${reg.id})">حذف</button></td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // تبديل حالة الطلب عند الضغط عليها (بانتظار المراجعة -> مقبول -> مرفوض)
        function toggleStatus(id) {
            let registrations = JSON.parse(localStorage.getItem('rlcsRegistrations')) || [];
            let reg = registrations.find(r => r.id === id);
            
            if (reg) {
                if (reg.status === 'بانتظار المراجعة') {
                    reg.status = 'مقبول ✅';
                } else if (reg.status === 'مقبول ✅') {
                    reg.status = 'مرفوض ❌';
                } else {
                    reg.status = 'بانتظار المراجعة';
                }
                localStorage.setItem('rlcsRegistrations', JSON.stringify(registrations));
                loadRegistrations();
            }
        }

        // حذف تسجيل
        function deleteReg(id) {
            if (confirm("هل أنت متأكد من حذف هذا التسجيل؟")) {
                let registrations = JSON.parse(localStorage.getItem('rlcsRegistrations')) || [];
                registrations = registrations.filter(reg => reg.id !== id);
                localStorage.setItem('rlcsRegistrations', JSON.stringify(registrations));
                loadRegistrations();
            }
        }

        // تصدير البيانات إلى ملف Excel/CSV
        function exportToCSV() {
            let registrations = JSON.parse(localStorage.getItem('rlcsRegistrations')) || [];
            if (registrations.length === 0) {
                alert("لا توجد بيانات لتصديرها!");
                return;
            }

            let csvContent = "\uFEFF"; // دعم اللغة العربية
            csvContent += "ID,Name,Rank,Discord,Payment,Status\n";

            registrations.forEach(r => {
                csvContent += `"${r.id}","${r.name}","${r.rank}","${r.discord}","${r.payment}","${r.status}"\n`;
            });

            let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'rlcs_registrations.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.onload = loadRegistrations;
    </script>
</body>
</html>
